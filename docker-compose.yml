version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: collab_db
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
    command: daphne -b 0.0.0.0 -p 8000 collab_workspace.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=collab_db
      - DB_USER=collab_user
      - DB_PASSWORD=collab_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    command: celery -A collab_workspace worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=collab_db
      - DB_USER=collab_user
      - DB_PASSWORD=collab_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
      - web

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

volumes:
  postgres_data:
